name: Build and Release Shelter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign and Release APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. دریافت سورس
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. نصب Java
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. تنظیم Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------
      # 4. Decode کردن keystore
      # --------------------------------------------------
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shelter.keystore"

          chmod 600 "$RUNNER_TEMP/shelter.keystore"

      # --------------------------------------------------
      # 5. Build و Sign کردن Release
      # --------------------------------------------------
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shelter.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew

          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      # --------------------------------------------------
      # 6. پیدا کردن APK
      # --------------------------------------------------
      - name: Locate APK
        run: |
          find app/build/outputs/apk/release -type f -name "*.apk" -print

      # --------------------------------------------------
      # 7. بررسی امضای APK
      # --------------------------------------------------
      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "APK: $APK"

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose \
            "$APK"

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --print-certs \
            "$APK"

      # --------------------------------------------------
      # 8. آماده‌سازی فایل Release
      # --------------------------------------------------
      - name: Prepare release files
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          cp "$APK" release/Shelter-${GITHUB_SHA::7}.apk

          cd release

          sha256sum *.apk > SHA256SUMS.txt

          echo "Release files:"
          ls -lh

          echo ""
          echo "SHA256:"
          cat SHA256SUMS.txt

      # --------------------------------------------------
      # 9. ایجاد GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shelter Release ${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/*.apk
            release/SHA256SUMS.txt
