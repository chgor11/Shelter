name: Build and Release Shelter

on:
  workflow_dispatch:

# اصل حداقل دسترسی:
# هیچ Job به صورت پیش‌فرض اجازه نوشتن ندارد.
permissions:
  contents: read

concurrency:
  group: shelter-release
  cancel-in-progress: false

jobs:

  # ==========================================================
  # 1. BUILD — بدون signing key
  #
  # خروجی این Job باید واقعاً unsigned باشد.
  # ==========================================================
  build:
    name: Build unsigned APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # --------------------------------------------------------
      # بررسی وضعیت Repository
      # --------------------------------------------------------
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Repository ====="
          git rev-parse HEAD

          echo ""
          echo "===== Branch / Ref ====="
          git symbolic-ref --short -q HEAD || true
          echo "${GITHUB_REF}"

          echo ""
          echo "===== Submodules ====="
          git submodule status --recursive

      # --------------------------------------------------------
      # بررسی دقیق SetupWizardLibrary
      # --------------------------------------------------------
      - name: Verify SetupWizardLibrary
        shell: bash
        run: |
          set -euo pipefail

          LIB="libs/SetupWizardLibrary"

          test -d "$LIB"

          echo "===== SetupWizardLibrary HEAD ====="
          git -C "$LIB" rev-parse HEAD

          echo ""
          echo "===== SetupWizardLibrary status ====="
          git -C "$LIB" status --short

      # --------------------------------------------------------
      # Java 17
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # --------------------------------------------------------
      # Build
      #
      # این Job هیچ signing secret ندارد.
      #
      # توجه:
      # پروژه باید assembleRelease را بدون signingConfig اجرا کند.
      # اگر پروژه خودش Release را امضا کند، این مرحله عمداً fail می‌شود
      # تا APK امضاشده به عنوان "unsigned" منتشر نشود.
      # --------------------------------------------------------
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew clean assembleRelease

      # --------------------------------------------------------
      # پیدا کردن APK
      # --------------------------------------------------------
      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK=$APK"

      # --------------------------------------------------------
      # اطمینان از اینکه APK واقعاً unsigned است
      # --------------------------------------------------------
      - name: Verify APK is unsigned
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          # به جای اتکا به exit code عمومی apksigner verify،
          # مستقیماً وجود امضای APK را با apksigner بررسی می‌کنیم.
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose "$APK" 2>&1 || true)"

          echo "===== apksigner output ====="
          echo "$VERIFY_OUTPUT"

          # APK امضاشده باید حداقل یکی از این عبارت‌های
          # "Verified using v1/v2/v3/v4 scheme" را داشته باشد.
          if echo "$VERIFY_OUTPUT" | grep -Eq 'Verified using v[1-4] scheme'; then
            echo "ERROR: APK is already signed."
            echo "The release build must produce a truly unsigned APK."
            exit 1
          fi

          echo "OK: APK has no recognized APK signing scheme."
          echo "This APK is suitable for signing on the local computer."

      # --------------------------------------------------------
      # آماده‌سازی نسخه unsigned برای Release
      # --------------------------------------------------------
      - name: Prepare unsigned release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p unsigned-release

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" \
            "unsigned-release/Shelter-unsigned-${GITHUB_SHA::12}.apk"

          sha256sum unsigned-release/*.apk \
            > unsigned-release/SHA256SUMS-unsigned.txt

          echo "===== Unsigned release files ====="
          ls -lh unsigned-release

          echo ""
          echo "===== Unsigned SHA-256 ====="
          cat unsigned-release/SHA256SUMS-unsigned.txt

      # --------------------------------------------------------
      # ذخیره APK unsigned برای Job بعدی
      # --------------------------------------------------------
      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: shelter-unsigned-apk
          path: unsigned-release/*
          if-no-files-found: error
          retention-days: 1


  # ==========================================================
  # 2. SIGN
  #
  # این Job تنها جایی است که signing key وجود دارد.
  #
  # برای امضای محلی:
  # APK موجود در unsigned-release همان فایل قابل امضا است.
  #
  # این Job همچنان نسخه signed را نیز تولید می‌کند تا Release
  # فعلی Shelter بدون تغییر قابلیت انتشار نسخه signed را داشته باشد.
  # ==========================================================
  sign:
    name: Sign APK
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Environment پیشنهادی:
    # production-signing
    #
    # در GitHub می‌توان برای آن Required reviewers تنظیم کرد.
    environment:
      name: production-signing

    steps:

      # --------------------------------------------------------
      # دریافت APK unsigned
      # --------------------------------------------------------
      - name: Download unsigned APK
        uses: actions/download-artifact@v7
        with:
          name: shelter-unsigned-apk
          path: unsigned-release

      # --------------------------------------------------------
      # Java 17
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------------
      # Decode keystore
      #
      # Secret فقط در این Job وجود دارد.
      # --------------------------------------------------------
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/shelter.keystore"

          chmod 600 "$RUNNER_TEMP/shelter.keystore"

      # --------------------------------------------------------
      # بررسی keystore
      # --------------------------------------------------------
      - name: Verify keystore and pin production certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          keytool -list \
            -keystore "$RUNNER_TEMP/shelter.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -v > "$RUNNER_TEMP/keystore-cert.txt"

          echo "===== Keystore certificate ====="
          grep -E '^(Owner|Issuer|Serial number|Valid from|SHA256:)' \
            "$RUNNER_TEMP/keystore-cert.txt" || true

          # The expected fingerprint is the SHA-256 digest of the DER certificate.
          # It must be stored as a protected GitHub Repository secret.
          EXPECTED_CERT_SHA256=$(printf '%s' "$RELEASE_CERT_SHA256" \
            | tr -d '[:space:]:-' \
            | tr '[:lower:]' '[:upper:]')

          case "$EXPECTED_CERT_SHA256" in
            (*[!0-9A-F]*|'')
              echo "ERROR: RELEASE_CERT_SHA256 is not a valid SHA-256 fingerprint."
              exit 1
              ;;
          esac

          if [ "${#EXPECTED_CERT_SHA256}" -ne 64 ]; then
            echo "ERROR: RELEASE_CERT_SHA256 must contain exactly 64 hexadecimal characters."
            exit 1
          fi

          ACTUAL_CERT_SHA256=$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/shelter.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sha256sum \
            | awk '{print toupper($1)}')

          echo "Keystore certificate SHA-256: $ACTUAL_CERT_SHA256"

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: Signing certificate does not match RELEASE_CERT_SHA256."
            echo "The configured signing key is not the approved production key."
            exit 1
          fi

          echo "OK: Keystore contains the approved production certificate."

      # --------------------------------------------------------
      # ایجاد نسخه signed از روی unsigned
      #
      # فایل unsigned دست‌نخورده باقی می‌ماند.
      # --------------------------------------------------------
      - name: Prepare signed APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p signed-release

          UNSIGNED_APK=$(find unsigned-release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$UNSIGNED_APK"

          cp "$UNSIGNED_APK" \
            "signed-release/Shelter-signed-${GITHUB_SHA::12}.apk"

      # --------------------------------------------------------
      # Sign
      # --------------------------------------------------------
      - name: Sign APK with V1 + V2 + V3 + V4
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shelter.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"

          APK=$(find signed-release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"
          rm -f "${APK}.idsig"

          "$APKSIGNER" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            "$APK"

          test -s "${APK}.idsig"
          echo "OK: V4 detached signature generated: ${APK}.idsig"

      # --------------------------------------------------------
      # Verify signed APK
      # --------------------------------------------------------
      - name: Verify signed APK V1 + V2 + V3 + V4
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK=$(find signed-release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"
          IDSIG="${APK}.idsig"
          test -s "$IDSIG"

          VERIFY_OUTPUT=$("$APKSIGNER" verify \
            --verbose \
            --v4-signature-file "$IDSIG" \
            "$APK" 2>&1)

          echo "===== apksigner verification ====="
          echo "$VERIFY_OUTPUT"

          for SCHEME in v1 v2 v3 v4; do
            if ! printf '%s\n' "$VERIFY_OUTPUT" \
              | grep -Eq "^Verified using ${SCHEME} scheme .*: true$"; then
              echo "ERROR: ${SCHEME} signature was not verified as true."
              exit 1
            fi
          done

          if ! printf '%s\n' "$VERIFY_OUTPUT" \
            | grep -Eq '^Number of signers: 1$'; then
            echo "ERROR: APK must have exactly one signer."
            exit 1
          fi

          EXPECTED_CERT_SHA256=$(printf '%s' "$RELEASE_CERT_SHA256" \
            | tr -d '[:space:]:-' \
            | tr '[:lower:]' '[:upper:]')

          APK_CERT_SHA256=$(printf '%s\n' "$VERIFY_OUTPUT" \
            | awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ {print toupper($2); exit}')

          if [ -z "$APK_CERT_SHA256" ] || [ "$APK_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: APK certificate does not match the approved production certificate."
            exit 1
          fi

          echo "OK: V1, V2, V3 and V4 signatures verified."
          echo "OK: APK is signed by the approved production certificate."

      # --------------------------------------------------------
      # نمایش certificate
      # --------------------------------------------------------
      - name: Print signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find signed-release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          echo "===== Certificate information ====="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            --v4-signature-file "${APK}.idsig" \
            "$APK"

      # --------------------------------------------------------
      # SHA256 برای هر دو نسخه
      # --------------------------------------------------------
      - name: Generate SHA256 files
        shell: bash
        run: |
          set -euo pipefail

          sha256sum signed-release/*.apk \
            > signed-release/SHA256SUMS-signed.txt

          # SHA-256 نسخه unsigned دوباره ثبت می‌شود تا همراه Release باشد.
          sha256sum unsigned-release/*.apk \
            > unsigned-release/SHA256SUMS-unsigned.txt

          echo "===== Unsigned SHA-256 ====="
          cat unsigned-release/SHA256SUMS-unsigned.txt

          echo ""
          echo "===== Signed SHA-256 ====="
          cat signed-release/SHA256SUMS-signed.txt

      # --------------------------------------------------------
      # ذخیره هر دو نسخه برای Job Release
      # --------------------------------------------------------
      - name: Upload signed and unsigned release files
        uses: actions/upload-artifact@v6
        with:
          name: shelter-release-files
          path: |
            unsigned-release/*.apk
            unsigned-release/SHA256SUMS-unsigned.txt
            signed-release/*.apk
            signed-release/*.idsig
            signed-release/SHA256SUMS-signed.txt
          if-no-files-found: error
          retention-days: 1

      # --------------------------------------------------------
      # حذف کلید
      # --------------------------------------------------------
      - name: Delete signing key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/shelter.keystore"


  # ==========================================================
  # 3. RELEASE
  #
  # این Job کلید امضا را ندارد.
  #
  # Release شامل:
  #   - APK signed
  #   - APK unsigned و قابل امضای محلی
  #   - SHA256 unsigned
  #   - SHA256 signed
  # ==========================================================
  release:
    name: Create GitHub Release
    needs: sign

    runs-on: ubuntu-latest

    permissions:
      contents: write

    environment:
      name: production-release

    steps:

      # --------------------------------------------------------
      # دریافت هر دو نسخه
      # --------------------------------------------------------
      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          name: shelter-release-files
          path: release

      # --------------------------------------------------------
      # بررسی نهایی نسخه unsigned
      # --------------------------------------------------------
      - name: Verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find release/unsigned-release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose "$APK" 2>&1 || true)"

          echo "===== apksigner output ====="
          echo "$VERIFY_OUTPUT"

          if echo "$VERIFY_OUTPUT" | grep -Eq 'Verified using v[1-4] scheme'; then
            echo "ERROR: The APK marked as unsigned is actually signed."
            exit 1
          fi

          echo "OK: Release unsigned APK is truly unsigned."

      # --------------------------------------------------------
      # بررسی نهایی نسخه signed
      # --------------------------------------------------------
      - name: Verify signed APK V1 + V2 + V3 + V4 and certificate
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK=$(find release/signed-release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"
          IDSIG="${APK}.idsig"
          test -s "$IDSIG"

          VERIFY_OUTPUT=$("$APKSIGNER" verify \
            --verbose \
            --print-certs \
            --v4-signature-file "$IDSIG" \
            "$APK" 2>&1)

          echo "===== Final apksigner verification ====="
          echo "$VERIFY_OUTPUT"

          for SCHEME in v1 v2 v3 v4; do
            if ! printf '%s\n' "$VERIFY_OUTPUT" \
              | grep -Eq "^Verified using ${SCHEME} scheme .*: true$"; then
              echo "ERROR: Final Release failed ${SCHEME} verification."
              exit 1
            fi
          done

          if ! printf '%s\n' "$VERIFY_OUTPUT" \
            | grep -Eq '^Number of signers: 1$'; then
            echo "ERROR: Final Release APK must have exactly one signer."
            exit 1
          fi

          EXPECTED_CERT_SHA256=$(printf '%s' "$RELEASE_CERT_SHA256" \
            | tr -d '[:space:]:-' \
            | tr '[:lower:]' '[:upper:]')

          APK_CERT_SHA256=$(printf '%s\n' "$VERIFY_OUTPUT" \
            | awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ {print toupper($2); exit}')

          if [ -z "$APK_CERT_SHA256" ] || [ "$APK_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: Final Release APK certificate is not the approved production certificate."
            exit 1
          fi

          echo "OK: Final Release passed V1 + V2 + V3 + V4 verification."
          echo "OK: Final Release certificate is the approved production certificate."

      # --------------------------------------------------------
      # نمایش Hashها
      # --------------------------------------------------------
      - name: Verify SHA256 records
        shell: bash
        run: |
          set -euo pipefail

          cd release

          echo "===== Unsigned SHA256 ====="
          cat unsigned-release/SHA256SUMS-unsigned.txt

          echo ""
          echo "===== Signed SHA256 ====="
          cat signed-release/SHA256SUMS-signed.txt

          echo ""
          echo "===== Release files ====="
          find . -maxdepth 2 -type f -print

      # --------------------------------------------------------
      # آماده‌سازی نام فایل‌ها برای Release
      # --------------------------------------------------------
      - name: Prepare GitHub Release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final-release

          cp release/unsigned-release/*.apk \
            final-release/

          cp release/unsigned-release/SHA256SUMS-unsigned.txt \
            final-release/

          cp release/signed-release/*.apk \
            final-release/

          cp release/signed-release/*.idsig \
            final-release/

          cp release/signed-release/SHA256SUMS-signed.txt \
            final-release/

          echo "===== Final Release files ====="
          ls -lh final-release

      # --------------------------------------------------------
      # انتشار
      # --------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Shelter Release v${{ github.run_number }}"
          generate_release_notes: true
          files: |
            final-release/*.apk
            final-release/*.idsig
            final-release/SHA256SUMS-unsigned.txt
            final-release/SHA256SUMS-signed.txt
