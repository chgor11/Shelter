name: Build and Release Shelter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign and Release
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. دریافت سورس پروژه
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. نصب Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. تنظیم Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------
      # 4. Decode کردن keystore
      # --------------------------------------------------
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shelter.keystore"
          chmod 600 "$RUNNER_TEMP/shelter.keystore"

      # --------------------------------------------------
      # 5. بررسی وجود keystore
      # --------------------------------------------------
      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/shelter.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      # --------------------------------------------------
      # 6. Build کردن Release با امضای خودمان
      # --------------------------------------------------
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shelter.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease

      # --------------------------------------------------
      # 7. پیدا کردن APK
      # --------------------------------------------------
      - name: Locate APK
        run: |
          echo "Release APK files:"
          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

      # --------------------------------------------------
      # 8. بررسی امضای APK
      # --------------------------------------------------
      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not found."
            exit 1
          fi

          echo "APK: $APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo ""
          echo "===== Signature verification ====="

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "===== Certificate information ====="

          "$APKSIGNER" verify \
            --print-certs \
            "$APK"

      # --------------------------------------------------
      # 9. آماده‌سازی Release
      # --------------------------------------------------
      - name: Prepare release
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle \
            | sed 's/.*versionName //' \
            | tr -d '"' \
            || true)

          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="build-${GITHUB_RUN_NUMBER}"
          fi

          cp "$APK" "release/Shelter-${VERSION_NAME}.apk"

          cd release

          sha256sum *.apk > SHA256SUMS.txt

          echo "Release files:"
          ls -lh

          echo ""
          echo "SHA-256:"
          cat SHA256SUMS.txt

      # --------------------------------------------------
      # 10. ایجاد GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Shelter Release v${{ github.run_number }}"
          generate_release_notes: true
          files: |
            release/*.apk
            release/SHA256SUMS.txt

      # --------------------------------------------------
      # 11. پاک کردن keystore
      # --------------------------------------------------
      - name: Delete temporary keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/shelter.keystore"
